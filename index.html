<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  padding: 20px;
  color: #e2e8f0;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* FORM */
.form {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input, select {
  padding: 8px;
  border-radius: 6px;
  border: none;
}

/* BOTÕES */
button {
  padding: 8px 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1e40af;
}

.excluir {
  background: #dc2626;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 5px;
}

.excluir:hover {
  background: #991b1b;
}

/* RESUMO */
.resumo {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.resumo-card {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
}

.total-mes { background: #1d4ed8; }
.total-variavel { background: #16a34a; }
.total-fixa { background: #334155; }

/* BOX */
.topo {
  display: flex;
  gap: 20px;
}

.box {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  flex: 1;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

/* CARDS */
.card {
  background: #0f172a;
  padding: 8px;
  border-radius: 8px;
  border-left: 4px solid #2563eb;
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card button {
  align-self: flex-start;
  margin-top: 5px;
}

/* TITULO DATA */
.data-titulo {
  grid-column: 1 / -1;
  margin-top: 15px;
  padding-bottom: 5px;
  border-bottom: 1px solid #334155;
  font-weight: bold;
  color: #93c5fd;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 Controle Financeiro Familiar</h1>

<div class="form">
  <input id="categoria" list="listaCategorias" placeholder="Categoria">
  <datalist id="listaCategorias"></datalist>

  <input id="valor" type="number" placeholder="Valor">
  <input id="data" type="date">

  <select id="tipo">
    <option>Variável</option>
    <option>Fixa</option>
  </select>

  <button onclick="salvar()">Salvar</button>
</div>

<!-- RESUMO -->
<div class="resumo">
  <div class="resumo-card total-mes" id="totalMes"></div>
  <div class="resumo-card total-variavel" id="totalVariavel"></div>
  <div class="resumo-card total-fixa" id="totalFixa"></div>
</div>

<div class="topo">
  <div class="box">
    <h3>📊 Totais por Categoria</h3>
    <div id="totais" class="grid"></div>
  </div>

  <div class="box">
    <h3>📅 Relatório por mês</h3>
    <input type="month" id="filtroMes" onchange="filtrarMes()">
  </div>
</div>

<div class="box" style="margin-top:20px;">
  <h3>📋 Lançamentos</h3>
  <div id="lista" class="grid"></div>
</div>

</div>

<script>

var supabase = window.supabase.createClient(
  "https://olcnvmnzyxnczgaxbkwt.supabase.co",
  "sb_publishable_9JPDR9QP-R_DYY5UcxsvDA_3Ulc2HU3"
);

let dados = [];

document.getElementById("data").valueAsDate = new Date();

// CARREGAR
async function carregar() {
  const { data, error } = await supabase
    .from("despesas")
    .select("*")
    .order("data", { ascending: false });

  if (error) {
    alert("Erro ao carregar");
    return;
  }

  dados = data;
  carregarMesAtual();
}

// SALVAR
async function salvar() {
  const categoria = document.getElementById("categoria").value;
  const valor = parseFloat(document.getElementById("valor").value);
  const data = document.getElementById("data").value;
  const tipo = document.getElementById("tipo").value;

  if (!categoria || !valor || !data) {
    alert("Preencha tudo");
    return;
  }

  const { error } = await supabase
    .from("despesas")
    .insert([{ categoria, valor, data, tipo }]);

  if (error) {
    alert("Erro ao salvar");
    return;
  }

  document.getElementById("categoria").value = "";
  document.getElementById("valor").value = "";
  document.getElementById("data").valueAsDate = new Date();

  carregar();
}

// EXCLUIR
async function excluir(id) {
  if (!confirm("Deseja excluir?")) return;

  await supabase
    .from("despesas")
    .delete()
    .eq("id", id);

  carregar();
}

// TELA (AGRUPADO POR DATA)
function atualizarTela(listaFiltrada = dados) {
  const lista = document.getElementById("lista");
  const totaisDiv = document.getElementById("totais");
  const datalist = document.getElementById("listaCategorias");

  lista.innerHTML = "";
  totaisDiv.innerHTML = "";
  datalist.innerHTML = "";

  let total = 0;
  let totalVariavel = 0;
  let totalFixa = 0;
  let categorias = {};

  let agrupado = {};

  listaFiltrada.forEach(item => {
    const valor = Number(item.valor);

    total += valor;
    if (item.tipo === "Variável") totalVariavel += valor;
    if (item.tipo === "Fixa") totalFixa += valor;

    categorias[item.categoria] = (categorias[item.categoria] || 0) + valor;

    if (!agrupado[item.data]) agrupado[item.data] = [];
    agrupado[item.data].push(item);
  });

  const datasOrdenadas = Object.keys(agrupado).sort((a, b) => b.localeCompare(a));

  datasOrdenadas.forEach(data => {

    lista.innerHTML += `
      <div class="data-titulo">
        📅 ${data.split("-").reverse().join("/")}
      </div>
    `;

    agrupado[data].forEach(item => {
      const valor = Number(item.valor);

      lista.innerHTML += `
        <div class="card">
          <strong>${item.categoria}</strong>
          R$ ${valor.toFixed(2)}
          ${item.tipo}
          <button class="excluir" onclick="excluir('${item.id}')">Excluir</button>
        </div>
      `;
    });
  });

  let categoriasUnicas = [...new Set(dados.map(d => d.categoria))];
  categoriasUnicas.forEach(cat => {
    datalist.innerHTML += `<option value="${cat}">`;
  });

  for (let cat in categorias) {
    totaisDiv.innerHTML += `
      <div class="card">
        <strong>${cat}</strong>
        R$ ${categorias[cat].toFixed(2)}
      </div>
    `;
  }

  document.getElementById("totalMes").innerText = "Total: R$ " + total.toFixed(2);
  document.getElementById("totalVariavel").innerText = "Variável: R$ " + totalVariavel.toFixed(2);
  document.getElementById("totalFixa").innerText = "Fixa: R$ " + totalFixa.toFixed(2);
}
  
function carregarMesAtual() {

  const hoje = new Date();

  const mesAtual =
    hoje.getFullYear() +
    "-" +
    String(hoje.getMonth() + 1).padStart(2, "0");

  document.getElementById("filtroMes").value = mesAtual;

  const filtrado = dados.filter(item =>
    item.data.startsWith(mesAtual)
  );

  atualizarTela(filtrado);
}
function filtrarMes() {

  const mes = document.getElementById("filtroMes").value;

  if (!mes) {
    carregarMesAtual();
    return;
  }

  const filtrado = dados.filter(item =>
    item.data.startsWith(mes)
  );

  atualizarTela(filtrado);
}
carregar();

</script>

</body>
</html>
