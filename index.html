<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Familiar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

h1 {
  text-align:center;
  color:#1e3a8a;
}

.form {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#fff;
  padding:12px;
  border-radius:10px;
}

.form input, .form select {
  padding:6px;
  font-size:13px;
}

button {
  background:#1e3a8a;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.main {
  display:grid;
  grid-template-columns: 1fr 300px;
  gap:20px;
  margin-top:20px;
}

.card {
  background:#fff;
  padding:15px;
  border-radius:10px;
}

.categorias {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.cat-item {
  background:#f1f5ff;
  padding:10px;
  border-left:4px solid #1e3a8a;
  border-radius:6px;
}

.total-box {
  margin-top:10px;
  background:#dbeafe;
  padding:10px;
  text-align:center;
  font-weight:bold;
}

.grid {
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:10px;
}

.item {
  background:#f1f5ff;
  padding:10px;
  border-top:4px solid #1e3a8a;
  border-radius:6px;
}
</style></head><body><h1>💰 Controle Financeiro Familiar</h1><div class="form">
  <input id="categoria" placeholder="Categoria">
  <input id="valor" type="number" placeholder="Valor">
  <input id="data" type="date">
  <select id="tipo">
    <option>Fixa</option>
    <option>Variável</option>
  </select>
  <button onclick="salvar()">Salvar</button>
</div><div class="main"><div>
  <div class="card">
    <h3>Totais por Categoria</h3>
    <div id="categorias" class="categorias"></div>
    <div class="total-box">
      Total: R$ <span id="totalMes">0</span>
    </div>
  </div>  <div class="card">
    <h3>Lançamentos</h3>
    <div id="lista" class="grid"></div>
  </div>
</div><div class="card">
  <h3>Relatório por mês</h3>
  <input type="month" id="mesFiltro" onchange="filtrarMes()">
  <div id="relatorio"></div>
</div></div><script>

// 🔌 CONEXÃO SUPABASE
const supabaseUrl = 'https://olcnvmnzyxnczgaxbkwt.supabase.co';
const supabaseKey = 'sb_publishable_9JPDR9QP-R_DYY5UcxsvDA_3Ulc2HU3';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let despesas = [];

// 💾 SALVAR
async function salvar() {
  const categoria = document.getElementById("categoria").value;
  const valor = Number(document.getElementById("valor").value);
  const data = document.getElementById("data").value;
  const tipo = document.getElementById("tipo").value;

  if (!categoria || !valor) {
    alert("Preencha os campos!");
    return;
  }

  const { error } = await supabase
    .from('despesas')
    .insert([{ categoria, valor, data, tipo }]);

  if (error) {
    alert("Erro ao salvar!");
    console.log(error);
    return;
  }

  document.getElementById("categoria").value = "";
  document.getElementById("valor").value = "";
  document.getElementById("data").valueAsDate = new Date();

  carregarDados();
}

// 📥 CARREGAR
async function carregarDados() {
  const { data, error } = await supabase
    .from('despesas')
    .select('*')
    .order('data', { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  despesas = data;
  atualizar();
}

// 📊 ATUALIZAR
function atualizar() {
  mostrarLista(despesas);
  calcularTotais(despesas);
}

// 📋 LISTA
function mostrarLista(listaDados) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  listaDados.forEach(d => {
    lista.innerHTML += `
      <div class="item">
        <b>${d.categoria}</b><br>
        R$ ${d.valor}<br>
        ${d.data || ""}<br>
        ${d.tipo}
      </div>
    `;
  });
}

// 📈 TOTAIS
function calcularTotais(listaDados) {
  let total = 0;
  let categorias = {};

  listaDados.forEach(d => {
    total += Number(d.valor);

    if (!categorias[d.categoria]) {
      categorias[d.categoria] = 0;
    }

    categorias[d.categoria] += Number(d.valor);
  });

  document.getElementById("totalMes").innerText = total.toFixed(2);

  const div = document.getElementById("categorias");
  div.innerHTML = "";

  for (let cat in categorias) {
    div.innerHTML += `
      <div class="cat-item">
        ${cat}<br>R$ ${categorias[cat].toFixed(2)}
      </div>
    `;
  }
}

// 📅 FILTRO MÊS
function filtrarMes() {
  const mes = document.getElementById("mesFiltro").value;

  if (!mes) return;

  const filtrado = despesas.filter(d => d.data && d.data.startsWith(mes));

  mostrarLista(filtrado);
}

// 🚀 INICIAR
document.getElementById("data").valueAsDate = new Date();
carregarDados();

</script></body>
</html>
