<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #1e3a8a;
}

.topo {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.form {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input, select, button {
  padding: 6px;
}

button {
  background: #1e3a8a;
  color: white;
  border: none;
  cursor: pointer;
}

.excluir {
  background: red;
  margin-top: 5px;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  flex: 1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.card {
  border-left: 4px solid #1e3a8a;
  padding: 8px;
  background: #f1f5ff;
  border-radius: 6px;
}

.total {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 Controle Financeiro Familiar</h1>

<div class="form">
  <input id="categoria" placeholder="Categoria">
  <input id="valor" type="number" placeholder="Valor">
  <input id="data" type="date">
  <select id="tipo">
    <option>Variável</option>
    <option>Fixa</option>
  </select>
  <button onclick="salvar()">Salvar</button>
</div>

<div class="topo">
  <div class="box">
    <h3>📊 Totais por Categoria</h3>
    <div id="totais" class="grid"></div>
    <div class="total" id="totalMes"></div>
  </div>

  <div class="box">
    <h3>📅 Relatório por mês</h3>
    <input type="month" id="filtroMes" onchange="filtrarMes()">
  </div>
</div>

<div class="box">
  <h3>📋 Lançamentos</h3>
  <div id="lista" class="grid"></div>
</div>

</div>

<script>

// 🔹 evita erro de duplicação
if (!window.supabaseClient) {
  window.supabaseClient = window.supabase.createClient(
    "https://olcnvmnzyxnczgaxbkwt.supabase.co",
    "sb_publishable_9JPDR9QP-R_DYY5UcxsvDA_3Ulc2HU3"
  );
}

var supabase = window.supabaseClient;

let dados = [];

// 🔹 CARREGAR
async function carregar() {
  const { data, error } = await supabase
    .from("despesas")
    .select("*")
    .order("data", { ascending: false });

  if (error) {
    console.log(error);
    alert("Erro ao carregar");
    return;
  }

  dados = data;
  atualizarTela();
}

// 🔹 SALVAR
async function salvar() {
  const categoria = document.getElementById("categoria").value;
  const valor = parseFloat(document.getElementById("valor").value);
  const data = document.getElementById("data").value;
  const tipo = document.getElementById("tipo").value;

  if (!categoria || !valor || !data) {
    alert("Preencha tudo");
    return;
  }

  const { error } = await supabase
    .from("despesas")
    .insert([{ categoria, valor, data, tipo }]);

  if (error) {
    console.log(error);
    alert("Erro ao salvar");
    return;
  }

  document.getElementById("categoria").value = "";
  document.getElementById("valor").value = "";
  document.getElementById("data").value = "";

  carregar();
}

// 🔹 EXCLUIR
async function excluir(id) {

  if (!confirm("Deseja excluir este lançamento?")) return;

  const { error } = await supabase
    .from("despesas")
    .delete()
    .eq("id", id);

  if (error) {
    console.log(error);
    alert("Erro ao excluir");
    return;
  }

  carregar();
}

// 🔹 ATUALIZAR TELA
function atualizarTela(listaFiltrada = dados) {
  const lista = document.getElementById("lista");
  const totaisDiv = document.getElementById("totais");
  const totalMesDiv = document.getElementById("totalMes");

  lista.innerHTML = "";
  totaisDiv.innerHTML = "";

  let total = 0;
  let categorias = {};

  listaFiltrada.forEach(item => {
    total += item.valor;

    if (!categorias[item.categoria]) {
      categorias[item.categoria] = 0;
    }

    categorias[item.categoria] += item.valor;

    lista.innerHTML += `
      <div class="card">
        <strong>${item.categoria}</strong><br>
        R$ ${item.valor.toFixed(2)}<br>
        ${item.data}<br>
        ${item.tipo}<br><br>
        <button class="excluir" onclick="excluir('${item.id}')">🗑️ Excluir</button>
      </div>
    `;
  });

  for (let cat in categorias) {
    totaisDiv.innerHTML += `
      <div class="card">
        <strong>${cat}</strong><br>
        R$ ${categorias[cat].toFixed(2)}
      </div>
    `;
  }

  totalMesDiv.innerText = "Total do mês: R$ " + total.toFixed(2);
}

// 🔹 FILTRO
function filtrarMes() {
  const mes = document.getElementById("filtroMes").value;

  if (!mes) {
    atualizarTela();
    return;
  }

  const filtrado = dados.filter(d => d.data.startsWith(mes));
  atualizarTela(filtrado);
}

// 🔹 INICIAR
carregar();

</script>

</body>
</html>
