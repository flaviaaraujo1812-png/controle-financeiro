<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Familiar</title><style>
body { font-family: Arial; background:#eef2f7; padding:20px; }
h1 { text-align:center; color:#1e3a8a; }

/* cards */
.card {
  background:#fff;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* inputs */
input, select, button {
  padding:10px;
  margin:5px;
  width:100%;
  max-width:300px;
}

/* botão */
button {
  background:#1e3a8a;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover {
  background:#162d6b;
}

/* layout lado a lado */
.flex {
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* lançamentos em 3 colunas */
.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
}

/* item lançamento */
.item {
  background:#f1f5ff;
  padding:10px;
  border-radius:8px;
  border-left:5px solid #1e3a8a;
}

.total {
  font-weight:bold;
  margin-top:10px;
}
</style></head><body><h1>💰 Controle Financeiro Familiar</h1><div class="card">
  <input id="categoria" placeholder="Categoria (Mercado, Lazer...)" />
  <input id="valor" type="number" placeholder="Valor" />
  <input id="data" type="date" />  <select id="tipo">
    <option value="Fixa">Fixa</option>
    <option value="Variável">Variável</option>
  </select><button onclick="salvar()">Salvar</button>

</div><div class="flex">
  <div class="card">
    <h2>📊 Totais por Categoria</h2>
    <div id="categorias"></div>
    <div class="total">Total do mês: R$ <span id="totalMes">0</span></div>
  </div>  <div class="card">
    <h2>📅 Relatório por mês</h2>
    <input type="month" id="mesFiltro" onchange="filtrarMes()" />
  </div>
</div><div class="card">
  <h2>🧾 Lançamentos</h2>
  <div id="lista" class="grid"></div>
</div><script>

let despesas = [];

function salvar() {
  const categoriaInput = document.getElementById("categoria");
  const valorInput = document.getElementById("valor");
  const dataInput = document.getElementById("data");
  const tipoInput = document.getElementById("tipo");

  const categoria = categoriaInput.value;
  const valor = Number(valorInput.value);
  const data = dataInput.value;
  const tipo = tipoInput.value;

  if (!categoria || !valor) {
    alert("Preencha os campos!");
    return;
  }

  despesas.push({ categoria, valor, data, tipo });

  // limpar campos
  categoriaInput.value = "";
  valorInput.value = "";
  dataInput.value = "";

  atualizar();
}

function atualizar() {
  mostrarLista(despesas);
  calcularTotais(despesas);
}

function mostrarLista(listaDados) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  listaDados.forEach(d => {
    lista.innerHTML += `
      <div class="item">
        <b>${d.categoria}</b><br>
        R$ ${d.valor.toFixed(2)}<br>
        <small>${d.data || ""}</small>
      </div>
    `;
  });
}

function calcularTotais(listaDados) {
  let total = 0;
  let categorias = {};

  listaDados.forEach(d => {
    total += d.valor;

    if (!categorias[d.categoria]) {
      categorias[d.categoria] = 0;
    }

    categorias[d.categoria] += d.valor;
  });

  document.getElementById("totalMes").innerText = total.toFixed(2);

  const divCat = document.getElementById("categorias");
  divCat.innerHTML = "";

  for (let cat in categorias) {
    divCat.innerHTML += `
      <div>${cat}: R$ ${categorias[cat].toFixed(2)}</div>
    `;
  }
}

function filtrarMes() {
  const mes = document.getElementById("mesFiltro").value;

  if (!mes) {
    atualizar();
    return;
  }

  const filtrado = despesas.filter(d => d.data && d.data.startsWith(mes));

  mostrarLista(filtrado);
  calcularTotais(filtrado);
}

</script></body>
</html>
