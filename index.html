<!DOCTYPE html><html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro Familiar</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    input, select, button {
      padding: 10px;
      margin: 5px;
      width: 100%;
      max-width: 300px;
    }
    .card {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body><h1>💰 Controle Financeiro Familiar</h1><div class="card">
  <input id="categoria" placeholder="Categoria (Mercado, Luz...)" />
  <input id="valor" type="number" placeholder="Valor" />
  <input id="data" type="date" />  <select id="tipo">
    <option value="Fixa">Fixa</option>
    <option value="Variável">Variável</option>
  </select><button onclick="salvar()">Salvar</button>

</div><h2>Total: R$ <span id="total">0</span></h2><div id="lista"></div><script>
let despesas = [];

function salvar() {
  const categoria = document.getElementById("categoria").value;
  const valor = document.getElementById("valor").value;
  const data = document.getElementById("data").value;
  const tipo = document.getElementById("tipo").value;

  if (!categoria || !valor) {
    alert("Preencha os campos!");
    return;
  }

  despesas.push({ categoria, valor: Number(valor), data, tipo });

  atualizar();
}

function atualizar() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  let total = 0;

  despesas.forEach(d => {
    total += d.valor;

    lista.innerHTML += `
      <div class="card">
        ${d.categoria} - R$ ${d.valor} <br>
        ${d.data} | ${d.tipo}
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}
</script></body>
</html>
